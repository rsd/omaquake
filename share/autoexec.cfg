// OmaQuake tuning.
//
// quake.rc runs this after default.cfg and config.cfg, so everything here
// wins. Copy it to the directory holding pak0.pak (normally id1/).

// --- turning -------------------------------------------------------------
// Quake's stock cl_yawspeed of 140 deg/sec assumes you also have a mouse for
// aiming and the keyboard is only for coarse turns. With the keyboard as the
// ONLY way to look around it is painfully slow, so open it up.
cl_yawspeed 280
cl_pitchspeed 200
// Holding Shift (+speed) multiplies the turn rate by this.
cl_anglespeedkey 1.5

// --- modifier keys -------------------------------------------------------
// This engine renumbers keys to match libretro's RETROK_* values, which
// renamed the modifiers to LCTRL/RCTRL/LSHIFT/RSHIFT/LALT/RALT. The shareware
// default.cfg still binds the original CTRL/SHIFT/ALT names, and those no
// longer exist in the keyname table -- so Key_StringToKeynum fails and the
// binds are dropped in silence. That is why fire, run and strafe do nothing
// out of the box. Rebind them under the names this engine actually knows.
bind LCTRL +attack
bind RCTRL +attack
bind LSHIFT +speed
bind RSHIFT +speed
bind LALT +strafe
bind RALT +strafe

// --- movement ------------------------------------------------------------
// Stock Quake predates the WASD convention: out of the box 'a' is +lookup,
// 'd' is +moveup and strafing lives on the comma and period keys. Rebind to
// the modern scheme and leave the arrow keys on turning.
bind w +forward
bind s +back
bind a +moveleft
bind d +moveright
bind e +moveup
bind q +movedown

// Look up/down keep their stock homes on PgDn/Del; End re-centres the view.

// --- mouse ---------------------------------------------------------------
// Pointer look is on whenever the terminal supports it (--no-mouse turns it
// off). The buttons arrive as MOUSE1..MOUSE7, with the wheel on MOUSE4 and
// MOUSE5 -- and nothing binds them by default, so they are dead until here.
bind MOUSE1 +attack
bind MOUSE2 +jump
bind MOUSE3 +forward
bind MOUSE4 "impulse 10"
bind MOUSE5 "impulse 12"

// --- display -------------------------------------------------------------
// A terminal is a very low resolution display. viewsize 100 hides the status
// bar and gives every cell to the world; drop to 90 to bring the HUD back.
viewsize 100
